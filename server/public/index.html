<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spitify</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        #search-box { width: 100%; max-width: 350px; box-sizing: border-box; padding: 12px; border-radius: 20px; border: none; outline: none; margin-bottom: 20px; }
        .track-item { display: flex; align-items: center; margin: 10px 0; background: #181818; padding: 10px; border-radius: 8px; border-left: 4px solid #2ad46b; }
        .track-item.youtube { border-left-color: #ff3d3d; }
        .track-item.soundcloud { border-left-color: #ff7700; }
        .track-item img { width: 60px; height: 45px; object-fit: cover; margin-right: 15px; border-radius: 4px; flex-shrink: 0; }
        .track-info { flex-grow: 1; min-width: 0; }
        .source-tag { font-size: 10px; text-transform: uppercase; background: #333; padding: 2px 6px; border-radius: 4px; }
        .play-btn { background: #2ad46b; border: none; padding: 8px 15px; border-radius: 20px; color: #121212; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        .pending { color: #888; font-size: 13px; margin: 0 0 10px; }
        audio { width: 100%; max-width: 400px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Search music</h2>
    <input type="text" id="search-box" placeholder="Search songs or artists..." />

    <div>
        <audio id="audio-player" controls></audio>
    </div>

    <div id="results-container"></div>

    <script src="app.js"></script>
</body>
</html>
