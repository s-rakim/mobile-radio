name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Use private signing key if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.SPITIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spitify-release.jks"
            echo "SPITIFY_KEYSTORE=$RUNNER_TEMP/spitify-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the private release key"
          else
            echo "No private key set, signing with the shared dev key"
          fi

      - name: Build release APK
        env:
          SPITIFY_KEYSTORE_PASSWORD: ${{ secrets.SPITIFY_KEYSTORE_PASSWORD }}
          SPITIFY_KEY_ALIAS: ${{ secrets.SPITIFY_KEY_ALIAS }}
          SPITIFY_KEY_PASSWORD: ${{ secrets.SPITIFY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Spitify-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Spitify-${{ env.VERSION_NAME }}
          path: Spitify-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Spitify ${{ env.VERSION_NAME }}
          body: |
            Install `Spitify-${{ env.VERSION_NAME }}.apk` on your Android phone (Android 8.0 or newer).
            You may need to allow installs from your browser or file manager the first time.
          files: Spitify-*.apk
          make_latest: true
