<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spitify</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        #search-box { width: 350px; padding: 12px; border-radius: 20px; border: none; outline: none; margin-bottom: 20px;}
        .track-item { display: flex; align-items: center; margin: 10px 0; background: #181818; padding: 10px; border-radius: 8px; border-left: 4px solid #1db954; }
        .track-item.youtube { border-left-color: #ff0000; } /* Distinct red accent for YouTube */
        .track-item img { width: 60px; height: 45px; object-fit: cover; margin-right: 15px; border-radius: 4px; }
        .track-info { flex-grow: 1; }
        .source-tag { font-size: 10px; text-transform: uppercase; background: #333; padding: 2px 6px; border-radius: 4px; }
        .play-btn { background: #1db954; border: none; padding: 8px 15px; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; }
        audio { width: 100%; max-width: 400px; margin-bottom: 20px;}
    </style>
</head>
<body>

    <h2>Search Music (Jamendo & YouTube)</h2>
    <input type="text" id="search-box" placeholder="Search tracks or YouTube videos..." />
    
    <div>
        <audio id="audio-player" controls crossorigin="anonymous"></audio>
    </div>

    <div id="results-container"></div>

    <script src="app.js"></script>
</body>
</html>
