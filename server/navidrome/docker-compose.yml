# Navidrome: your own music server for Spitify.
# Copy .env.example to .env, set MUSIC_DIR, then run: docker compose up -d
services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "168h"
      ND_ENABLESHARING: "true"
      ND_ENABLEDOWNLOADS: "true"
      ND_DEFAULTLANGUAGE: "en"
    volumes:
      - ./data:/data
      - "${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro"
