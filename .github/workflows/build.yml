name: Build APK

# Builds only when started by hand: Actions → Build APK → Run workflow. Pushes and pull
# requests don't build, so code can go up without using Actions minutes on every change.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Either a variable or a secret works.
      SPITIFY_SERVER_URL: ${{ vars.SPITIFY_SERVER_URL || secrets.SPITIFY_SERVER_URL }}
      # Kept as a secret so it's masked in logs. The old variable still works as a fallback.
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID || vars.SPOTIFY_CLIENT_ID }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships with the Android SDK, and Gradle fetches any missing platform.
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      # Spotify's App Remote SDK isn't on Maven, only on their GitHub releases.
      # If the download fails the APK still builds, just without "Play through Spotify".
      - name: Fetch the Spotify SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-spotify-sdk.sh
          ls -la app/libs || true

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPITIFY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SPITIFY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPITIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPITIFY_KEY_PASSWORD }}
        run: |
          STORE="$RUNNER_TEMP/spitify-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$STORE"
            echo "Signing with the release key from secrets"
          else
            # No secrets (forks, or before they're added). This key only lives for this run,
            # so the APK won't install over an earlier build. See docs/BUILDING.md.
            KEYSTORE_PASSWORD="throwaway-$GITHUB_RUN_ID"
            KEY_ALIAS=spitify
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$STORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Spitify CI"
            echo "::warning::SPITIFY_KEYSTORE_BASE64 isn't set, so this APK is signed with a one-off key and won't update an installed copy."
          fi
          {
            echo "SPITIFY_KEYSTORE=$STORE"
            echo "SPITIFY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SPITIFY_KEY_ALIAS=$KEY_ALIAS"
            echo "SPITIFY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Spitify-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Spitify-${{ env.VERSION_NAME }}
          path: Spitify-*.apk

      - name: Publish release
        # Runs started on main become a release (and reach the in-app updater). Other branches
        # only get the APK as a download on the run page, for testing.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Spitify ${{ env.VERSION_NAME }}
          body: |
            Install `Spitify-${{ env.VERSION_NAME }}.apk` on your Android phone (Android 8.0 or newer).
            You may need to allow installs from your browser or file manager the first time.
          files: Spitify-*.apk
          make_latest: true

  # Branch builds also boot an emulator, walk through the main screens and save a screenshot of
  # each (app/src/androidTest/.../ScreenTour.kt). The PNGs land on the run page and on the
  # `screenshots` branch under the branch's name, so the look can be checked without a phone.
  screens:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and the screen tour
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # With the Spotify app's secret the tour also opens real Spotify artist pages and song
      # details (an app-only token, no account). Without it those steps are skipped.
      - name: Spotify for the tour
        env:
          ID: ${{ secrets.SPOTIFY_CLIENT_ID || vars.SPOTIFY_CLIENT_ID || 'e8b9ce6fd41c44acb05eb5ab44f149f0' }}
          SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET || vars.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ -n "$SECRET" ]; then
            echo "SPOTIFY_TOUR_ARGS=-e spotifyClientId $ID -e spotifyClientSecret $SECRET" >> "$GITHUB_ENV"
          else
            echo "::notice::SPOTIFY_CLIENT_SECRET isn't set, so the tour skips Spotify pages."
          fi

      # A throwaway Spitify server next to the emulator (10.0.2.2 from inside it), so the tour can
      # sign in, chat with a second account and send songs for real.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Spitify server for the chat tour
        run: |
          cd server
          npm install --omit=dev --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/spitify-data"
          DATA_DIR="$RUNNER_TEMP/spitify-data" PORT=3000 nohup node index.js > "$RUNNER_TEMP/spitify-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:3000 && break; sleep 1; done
          curl -s -o /dev/null -w "server answers: %{http_code}\n" localhost:3000
          echo "CHAT_TOUR_ARGS=-e chatServer http://10.0.2.2:3000" >> "$GITHUB_ENV"

      - name: Run the tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.srakim.spitify.ScreenTour $SPOTIFY_TOUR_ARGS $CHAT_TOUR_ARGS com.srakim.spitify.debug.test/androidx.test.runner.AndroidJUnitRunner || true
            mkdir -p shots && adb pull /sdcard/Android/data/com.srakim.spitify.debug/files/shots/. shots/ || true
            ls -la shots
            cat shots/*.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.run_number }}
          path: shots/*.png
          if-no-files-found: warn

      - name: Save the screenshots to the screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || exit 0
          DIR="$RUNNER_TEMP/screens"
          git clone --depth 1 --branch screenshots "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "$DIR" 2>/dev/null || {
            git init "$DIR" && git -C "$DIR" checkout -b screenshots
            git -C "$DIR" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          }
          TARGET="$DIR/${BRANCH//\//-}/run-$GITHUB_RUN_NUMBER"
          mkdir -p "$TARGET" && cp shots/*.png "$TARGET/"
          cd "$DIR"
          git config user.name "s-rakim"
          git config user.email "153083325+s-rakim@users.noreply.github.com"
          git add -A && git commit -qm "Screens from run $GITHUB_RUN_NUMBER on $BRANCH" && git push origin HEAD:screenshots
