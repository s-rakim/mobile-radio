name: Build APK

# Builds only when started by hand: Actions → Build APK → Run workflow. Pushes and pull
# requests don't build, so code can go up without using Actions minutes on every change.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships with the Android SDK, and Gradle fetches any missing platform.
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPITIFY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SPITIFY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPITIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPITIFY_KEY_PASSWORD }}
        run: |
          STORE="$RUNNER_TEMP/spitify-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$STORE"
            echo "Signing with the release key from secrets"
          else
            # No secrets (forks, or before they're added). This key only lives for this run,
            # so the APK won't install over an earlier build. See docs/BUILDING.md.
            KEYSTORE_PASSWORD="throwaway-$GITHUB_RUN_ID"
            KEY_ALIAS=spitify
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$STORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Spitify CI"
            echo "::warning::SPITIFY_KEYSTORE_BASE64 isn't set, so this APK is signed with a one-off key and won't update an installed copy."
          fi
          {
            echo "SPITIFY_KEYSTORE=$STORE"
            echo "SPITIFY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SPITIFY_KEY_ALIAS=$KEY_ALIAS"
            echo "SPITIFY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Spitify-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Spitify-${{ env.VERSION_NAME }}
          path: Spitify-*.apk

      - name: Publish release
        # Runs started on main become a release (and reach the in-app updater). Other branches
        # only get the APK as a download on the run page, for testing.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Spitify ${{ env.VERSION_NAME }}
          body: |
            Install `Spitify-${{ env.VERSION_NAME }}.apk` on your Android phone (Android 8.0 or newer).
            You may need to allow installs from your browser or file manager the first time.
          files: Spitify-*.apk
          make_latest: true
